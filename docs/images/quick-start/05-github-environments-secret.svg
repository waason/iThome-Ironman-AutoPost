<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" fill="#172033" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Environments 與 Secret 設定</title>
  <desc id="desc">建立三個指定名稱的 GitHub Environment，並在每一個 Environment 新增相同名稱的登入狀態 Secret。</desc>
  <style>
    text { font-family: "Segoe UI", "Microsoft JhengHei", sans-serif; }
    .title { font-size: 38px; font-weight: 700; }
    .subtitle { font-size: 20px; fill: #526079; }
    .path { font-size: 21px; font-weight: 700; }
    .card-title { font-family: Consolas, monospace; font-size: 23px; font-weight: 700; }
    .body { font-size: 18px; }
    .secret { font-family: Consolas, monospace; font-size: 19px; font-weight: 700; }
    .number { font-size: 22px; font-weight: 800; fill: #fff; }
  </style>
  <rect width="1400" height="900" rx="28" fill="#f8fafc"/>
  <text x="70" y="78" class="title">步驟 5｜建立 3 個 GitHub Environments</text>
  <text x="70" y="116" class="subtitle">名稱必須與 workflow 完全一致，大小寫與連字號都不能改。</text>

  <rect x="70" y="155" width="1260" height="70" rx="18" fill="#172033"/>
  <text x="700" y="199" text-anchor="middle" class="path" fill="#fff">Repository → Settings → Environments → New environment</text>

  <g transform="translate(70 270)">
    <rect width="390" height="250" rx="22" fill="#fff" stroke="#93c5fd" stroke-width="3"/>
    <circle cx="50" cy="50" r="26" fill="#2563eb"/><text x="50" y="58" text-anchor="middle" class="number">1</text>
    <text x="92" y="58" class="card-title">ithome-preview</text>
    <text x="32" y="116" class="body">只填入 Day 1，不儲存</text>
    <rect x="32" y="148" width="326" height="62" rx="12" fill="#eff6ff"/>
    <text x="195" y="176" text-anchor="middle" class="body">Environment secret</text>
    <text x="195" y="199" text-anchor="middle" class="secret" fill="#1d4ed8">ITHOME_STORAGE_STATE_B64</text>
  </g>

  <g transform="translate(505 270)">
    <rect width="390" height="250" rx="22" fill="#fff" stroke="#fdba74" stroke-width="3"/>
    <circle cx="50" cy="50" r="26" fill="#ea580c"/><text x="50" y="58" text-anchor="middle" class="number">2</text>
    <text x="92" y="58" class="card-title">ithome-save-draft</text>
    <text x="32" y="116" class="body">允許寫入並讀回草稿</text>
    <rect x="32" y="148" width="326" height="62" rx="12" fill="#fff7ed"/>
    <text x="195" y="176" text-anchor="middle" class="body">Environment secret</text>
    <text x="195" y="199" text-anchor="middle" class="secret" fill="#c2410c">ITHOME_STORAGE_STATE_B64</text>
  </g>

  <g transform="translate(940 270)">
    <rect width="390" height="250" rx="22" fill="#fff" stroke="#fca5a5" stroke-width="3"/>
    <circle cx="50" cy="50" r="26" fill="#dc2626"/><text x="50" y="58" text-anchor="middle" class="number">3</text>
    <text x="92" y="58" class="card-title">ithome-publish</text>
    <text x="32" y="116" class="body">允許正式公開文章</text>
    <rect x="32" y="148" width="326" height="62" rx="12" fill="#fef2f2"/>
    <text x="195" y="176" text-anchor="middle" class="body">Environment secret</text>
    <text x="195" y="199" text-anchor="middle" class="secret" fill="#b91c1c">ITHOME_STORAGE_STATE_B64</text>
  </g>

  <rect x="175" y="570" width="1050" height="92" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="700" y="606" text-anchor="middle" class="path">每個 Environment 內：Environment secrets → Add secret</text>
  <text x="700" y="640" text-anchor="middle" class="body">Name 填 ITHOME_STORAGE_STATE_B64，Value 貼上 Base64 全文</text>

  <rect x="175" y="690" width="1050" height="70" rx="18" fill="#fef3c7"/>
  <text x="700" y="719" text-anchor="middle" class="body" fill="#92400e">GitHub Free + Private Repo：改在 Actions Secrets 建立一次 Repository secret</text>
  <text x="700" y="746" text-anchor="middle" class="body" fill="#92400e">這個方案無法設定 Private Repo 的 Environment secrets。</text>

  <rect x="175" y="790" width="1050" height="74" rx="18" fill="#fee2e2"/>
  <text x="700" y="821" text-anchor="middle" class="body" fill="#991b1b">Cookie 等同登入憑證：禁止 commit、Issue、log、artifact 與公開截圖</text>
  <text x="700" y="848" text-anchor="middle" class="body" fill="#991b1b">若方案支援，請替 save-draft 與 publish 設定 Required reviewers。</text>
</svg>
